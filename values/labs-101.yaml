# labs-101 in production (chart deploy/helm/labs-101 of the app repo).
# backend.image.tag and frontend.image.tag are written by the CI of labs-101 (workflow images.yaml),
# every change of them is a commit here and argo cd deploys exactly that build

auth:
  # organization of the users in zitadel (not a secret), for the URLs of the profile pictures
  zitadelOrgId: "394480551534329860"
  audience: ""
# keys see deploy/helm/labs-101/templates/secret.yaml, created once by hand (argocd/README.md)
secrets:
  existingSecret: labs-101-secrets
frontend:
  image:
    tag: ef74ef5a2db7365d1d47a003a100aa00dec1d08e
    pullPolicy: IfNotPresent
backend:
  image:
    tag: ef74ef5a2db7365d1d47a003a100aa00dec1d08e
    pullPolicy: IfNotPresent
  metrics:
    serviceMonitor:
      enabled: true
    dashboard:
      enabled: true
# routes come from the cloudflare tunnel, no ingress controller needed
ingress:
  enabled: false
