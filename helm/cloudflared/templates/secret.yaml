{{- if and (eq .Values.tunnel.mode "token") .Values.tunnel.token.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudflared.fullname" . }}-token
  labels:
    {{- include "cloudflared.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.tunnel.token.key }}: {{ .Values.tunnel.token.value | quote }}
{{- end }}
