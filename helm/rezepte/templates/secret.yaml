{{- if not .Values.secrets.existingSecret }}
{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rezepte.fullname" . }}
  labels:
    {{- include "rezepte.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required" $s.postgresPassword | quote }}
  AUTH_CLIENT_ID: {{ required "secrets.authClientId is required" $s.authClientId | quote }}
  AUTH_CLIENT_SECRET: {{ required "secrets.authClientSecret is required" $s.authClientSecret | quote }}
  {{- if lt (len (required "secrets.authSecret is required" $s.authSecret)) 32 }}
  {{- fail "secrets.authSecret must have at least 32 characters" }}
  {{- end }}
  AUTH_SECRET: {{ $s.authSecret | quote }}
{{- end }}
