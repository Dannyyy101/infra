{{- if not .Values.secrets.existingSecret }}
{{- $s := .Values.secrets }}
{{- if ne (len (required "secrets.masterkey is required" $s.masterkey)) 32 }}
{{- fail "secrets.masterkey must have exactly 32 characters" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "auth.fullname" . }}
  labels:
    {{- include "auth.labels" . | nindent 4 }}
type: Opaque
stringData:
  ZITADEL_MASTERKEY: {{ $s.masterkey | quote }}
  POSTGRES_USERNAME: {{ required "secrets.postgresUsername is required" $s.postgresUsername | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required" $s.postgresPassword | quote }}
  ZITADEL_DB_PASSWORD: {{ required "secrets.zitadelDbPassword is required" $s.zitadelDbPassword | quote }}
  ZITADEL_ADMIN_PASSWORD: {{ required "secrets.adminPassword is required" $s.adminPassword | quote }}
{{- end }}
