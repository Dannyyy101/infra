image:
  repository: rustfs/rustfs
  # leer: appVersion aus Chart.yaml
  tag: ""
  pullPolicy: IfNotPresent

# 0 nur für den Umzug der Daten (argocd/README.md): das Volume existiert, aber RustFS schreibt nicht hinein
replicas: 1

# Secrets entweder hier setzen (nicht committen!) oder selbst anlegen und in existingSecret nennen.
# Keys: RUSTFS_ACCESS_KEY, RUSTFS_SECRET_KEY (Root-Zugang, für Apps besser eigene Access Keys in der Konsole)
secrets:
  existingSecret: ""
  accessKey: ""
  secretKey: ""

persistence:
  size: 20Gi
  storageClass: ""

# warn, info, debug
logLevel: warn

resources:
  requests:
    cpu: 50m
    memory: 384Mi
  limits:
    memory: 1Gi

extraEnv: []
