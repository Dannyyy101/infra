{{- if not .Values.secrets.existingSecret }}
{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rustfs.fullname" . }}
  labels:
    {{- include "rustfs.labels" . | nindent 4 }}
type: Opaque
stringData:
  RUSTFS_ACCESS_KEY: {{ required "secrets.accessKey is required" $s.accessKey | quote }}
  RUSTFS_SECRET_KEY: {{ required "secrets.secretKey is required" $s.secretKey | quote }}
{{- end }}
