{{- $name := include "rustfs.fullname" . }}
# S3-API für andere Apps im Cluster: http://<release>.<namespace>.svc.cluster.local:9000,
# von außen über den Tunnel. Die Konsole (9001) bekommt bewusst keine Route, nur per port-forward.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "rustfs.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "rustfs.selectorLabels" . | nindent 4 }}
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
  labels:
    {{- include "rustfs.labels" . | nindent 4 }}
  annotations:
    # die Objekte überleben auch das Löschen der Application
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "rustfs.labels" . | nindent 4 }}
    {{- include "rustfs.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  # ein Volume, ReadWriteOnce: nie zwei Instanzen gleichzeitig auf denselben Daten
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "rustfs.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rustfs.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      securityContext:
        # rustfs im Image
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: rustfs
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          envFrom:
            # RUSTFS_ACCESS_KEY, RUSTFS_SECRET_KEY
            - secretRef:
                name: {{ include "rustfs.secretName" . }}
          env:
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ADDRESS
              value: ":9000"
            - name: RUSTFS_CONSOLE_ADDRESS
              value: ":9001"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            - name: RUSTFS_OBS_LOGGER_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            # RustFS schreibt seine Logs in Dateien unter /logs (wie bisher), kubectl logs zeigt nur den Start
            - name: logs
              mountPath: /logs
          readinessProbe:
            httpGet:
              path: /health/ready
              port: s3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: s3
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-data
        - name: logs
          emptyDir:
            sizeLimit: 1Gi
