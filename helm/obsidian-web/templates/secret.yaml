{{- if not .Values.secrets.existingSecret }}
{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "obsidian-web.fullname" . }}
  labels:
    {{- include "obsidian-web.labels" . | nindent 4 }}
type: Opaque
stringData:
  OAUTH2_PROXY_CLIENT_ID: {{ required "secrets.clientId is required" $s.clientId | quote }}
  OAUTH2_PROXY_CLIENT_SECRET: {{ required "secrets.clientSecret is required" $s.clientSecret | quote }}
  OAUTH2_PROXY_COOKIE_SECRET: {{ required "secrets.cookieSecret is required" $s.cookieSecret | quote }}
{{- end }}
