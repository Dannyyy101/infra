# öffentliche URL, Zitadel leitet zurück auf https://<host>/oauth2/callback
host: notes.project101.tech

image:
  repository: ghcr.io/dannyyy101/obsidian-web
  # schreibt die CI des App-Repos (Commit-SHA), siehe values/obsidian-web.yaml
  tag: latest
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Secrets entweder hier setzen (nicht committen!) oder selbst anlegen und in existingSecret nennen.
# Keys: OAUTH2_PROXY_CLIENT_ID, OAUTH2_PROXY_CLIENT_SECRET, OAUTH2_PROXY_COOKIE_SECRET
secrets:
  existingSecret: ""
  # Application in Zitadel (Web, Code Flow, Client Secret Basic)
  clientId: ""
  clientSecret: ""
  # 16, 24 oder 32 Bytes, z. B. openssl rand -base64 32 | tr -- '+/' '-_'
  cookieSecret: ""

auth:
  # öffentliche URL von Zitadel (helm/auth), muss zum iss der Tokens passen
  issuer: https://auth.project101.tech

app:
  # Pflicht: Ziel-Hosts für den CORS-Proxy /__proxy (kommagetrennt), z. B. der S3- oder WebDAV-Host des Syncs
  proxyAllowedHosts: s3.project101.tech
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
  extraEnv: []

oauth2Proxy:
  image:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: v7.7.1
    pullPolicy: IfNotPresent
  # lange Session, damit der Sync im Hintergrund nicht ständig an einer abgelaufenen Anmeldung scheitert
  cookieExpire: 720h
  cookieRefresh: 1h
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  extraEnv: []
