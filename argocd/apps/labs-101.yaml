# chart from the app repo, environment (image tags, hosts, settings) from this repo:
# the CI of labs-101 builds the images and writes their tags into values/labs-101.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: labs-101
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/Dannyyy101/labs-101.git
      targetRevision: main
      path: deploy/helm/labs-101
      helm:
        releaseName: labs-101
        valueFiles:
          - $values/values/labs-101.yaml
    - repoURL: https://github.com/Dannyyy101/infra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: labs-101
  syncPolicy:
    automated:
      # stateful (postgres), removed resources are only reported, deleting them stays a manual decision
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
